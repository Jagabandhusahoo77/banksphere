# Chart-wide defaults. Environment-specific files (values-dev.yaml,
# values-test.yaml) are layered ON TOP of this file — see each Argo CD
# Application's spec.source.helm.valueFiles (registered by
# infrastructure/terraform/modules/k3s) — and override ONLY what
# genuinely differs per environment: image tag, ingress/CORS hostnames,
# and (if ever needed) resource sizing. Everything that is the same in
# every environment (ports, health-check paths, DB names, which service
# calls which) belongs here, once, not duplicated per environment.
#
# Service-to-service and DB_HOST hostnames below are plain Kubernetes
# Service names (e.g. "postgres", "customer-service") — deliberately
# identical to docker/local/docker-compose.yml's own container names, so
# an env var value like CUSTOMER_SERVICE_URL is literally unchanged
# between local Docker Compose and this chart. See docs/deployment/helm.md.

imagePullSecrets:
  # Must match modules/k3s's ecr_secret_name — the node's systemd timer
  # (see modules/k3s/templates/bootstrap.sh.tpl) keeps this Secret's ECR
  # token refreshed every few hours; this chart only ever references it,
  # never creates it.
  name: ecr-registry-credentials

# Must match modules/k3s's app_secret_name — populated ONCE at node
# bootstrap from SSM (DB_PASSWORD/JWT_SECRET/EMPLOYEE_JWT_SECRET), never
# created or modified by this chart. See docs/deployment/secrets.md.
appSecretName: banksphere-app-secrets

image:
  # <account-id>.dkr.ecr.<region>.amazonaws.com — set in each
  # values-<env>.yaml once the ECR registry is known (it's a Terraform
  # output, not knowable at chart-authoring time). Left empty here on
  # purpose — an empty registry is invalid and `helm template`/lint will
  # only catch it if a values-<env>.yaml is layered on top, same as any
  # other required-but-environment-specific value in this chart.
  registry: ""
  # Must match modules/ecr's repository naming exactly:
  # "${project_name}/${service_name}" (e.g. "banksphere/customer-service")
  # — see infrastructure/terraform/modules/ecr/main.tf. NOT a Helm
  # release/chart convention, purely mirroring the actual ECR repo names.
  repositoryPrefix: banksphere
  # Overwritten by the CI pipeline's GitOps commit on every build — see
  # docs/deployment/gitops.md. Never "latest": see ADR-precedent in
  # modules/ecr (immutable, git-SHA tags only).
  tag: "unset"
  pullPolicy: IfNotPresent

# The single internal entry point for api-<env>.<domain>, fanning out to
# the six backend services by their EXISTING @RequestMapping path
# prefixes — mirrors infrastructure/docker/{dev,test}/gateway.nginx.conf
# exactly (no backend route was renamed to make this possible). Traefik
# ships bundled with k3s — see modules/k3s's own comment for why no
# separate ingress controller install was needed.
ingress:
  enabled: true
  className: traefik
  # api-dev.<domain> / api-test.<domain> — set per environment. Empty
  # string is a supported state (matches modules/dns's own
  # domain_configured gate): Traefik still gets an Ingress with no host
  # rule, reachable via the ALB regardless of hostname.
  host: ""
  # ops-dev.<domain> / ops-test.<domain> — employee-portal's own host,
  # a SEPARATE Ingress rule from the one above (see templates/ingress.yaml)
  # so it can be routed to a different backend Service by Host header.
  # Empty is a supported state, same reasoning as host above: with
  # employeePortal.enabled but this left empty, templates/ingress.yaml
  # skips the rule entirely rather than creating a host-less one that
  # would collide with the rule above.
  opsHost: ""

postgres:
  enabled: true
  image: postgres:16-alpine
  port: 5432
  # Non-secret — matches docker-compose's own DB_USERNAME default
  # exactly. The actual secret is DB_PASSWORD, from appSecretName.
  username: banksphere
  # database-per-service, mirroring
  # infrastructure/docker/*/postgres-init/001-create-databases.sh exactly
  # — POSTGRES_DB creates the first one, the init script (shipped here as
  # a ConfigMap, see templates/postgres-init-configmap.yaml) creates the
  # rest.
  primaryDatabase: banksphere_customer
  additionalDatabases:
    - banksphere_account
    - banksphere_transaction
    - banksphere_beneficiary
    - banksphere_employee
    - banksphere_kyc
  storage: 5Gi
  # k3s's bundled dynamic provisioner, backed by the EC2 node's own root
  # EBS volume (see modules/ec2's root_volume_size_gb) — no separate EBS
  # volume/CSI driver needed for a single-node cluster. See
  # docs/deployment/postgresql.md.
  storageClassName: local-path
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# One entry per backend service. All six are the same shape (one Spring
# Boot container, DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD from
# appSecretName, GET /actuator/health for both liveness and readiness)
# — see templates/backend-deployment.yaml's single range over this map,
# rather than one template per service. secretEnv lists which keys of
# appSecretName (JWT_SECRET / EMPLOYEE_JWT_SECRET) this specific service
# actually needs injected — mirrors docker/local/docker-compose.yml's
# own per-service list exactly (e.g. employee-service never gets
# JWT_SECRET; it only ever verifies/issues EMPLOYEE_JWT_SECRET tokens).
services:
  customer-service:
    enabled: true
    port: 8081
    dbName: banksphere_customer
    replicas: 1
    ingressPaths:
      - /api/v1/auth
      - /api/v1/customers
    secretEnv: [JWT_SECRET, EMPLOYEE_JWT_SECRET]
    resources:
      requests: { cpu: 150m, memory: 384Mi }
      limits: { memory: 640Mi }
    env:
      JWT_EXPIRATION: "3600"
      OTP_LENGTH: "6"
      OTP_EXPIRY_SECONDS: "300"
      OTP_MAX_ATTEMPTS: "5"
      OTP_RESEND_COOLDOWN_SECONDS: "30"
      OTP_STEP_UP_EXPIRY_SECONDS: "300"
      # MUST be "false" in DEV/TEST beyond throwaway smoke-testing and in
      # any environment reachable outside the team — see
      # DevOtpInboxController's javadoc. Overridable per environment.
      OTP_DEV_INBOX_ENABLED: "true"
      REFRESH_TOKEN_EXPIRY_SECONDS: "1209600"
      # true once served over HTTPS end-to-end (api-<env>.<domain> via
      # ACM) — a Secure cookie is silently dropped by the browser over
      # plain HTTP. Overridden to "true" in values-dev.yaml/values-test.yaml
      # once a domain is configured; left "false" here so an
      # un-configured (HTTP-only, no domain) environment still works.
      COOKIE_SECURE: "false"
      # Set per environment once a domain exists (app-<env>.<domain>) —
      # see this file's header comment on why this can't have a real
      # default here.
      CORS_ALLOWED_ORIGINS: ""

  account-service:
    enabled: true
    port: 8082
    dbName: banksphere_account
    replicas: 1
    ingressPaths:
      - /api/v1/accounts
    secretEnv: [JWT_SECRET, EMPLOYEE_JWT_SECRET]
    resources:
      requests: { cpu: 150m, memory: 384Mi }
      limits: { memory: 640Mi }
    env:
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      STEP_UP_TRANSFER_THRESHOLD: "50000.00"
      CORS_ALLOWED_ORIGINS: ""

  transaction-service:
    enabled: true
    port: 8083
    dbName: banksphere_transaction
    replicas: 1
    ingressPaths:
      - /api/v1/transactions
    secretEnv: [JWT_SECRET, EMPLOYEE_JWT_SECRET]
    resources:
      requests: { cpu: 150m, memory: 384Mi }
      limits: { memory: 640Mi }
    env:
      ACCOUNT_SERVICE_URL: http://account-service:8082
      CORS_ALLOWED_ORIGINS: ""

  beneficiary-service:
    enabled: true
    port: 8084
    dbName: banksphere_beneficiary
    replicas: 1
    ingressPaths:
      - /api/v1/beneficiaries
    secretEnv: [JWT_SECRET]
    resources:
      requests: { cpu: 100m, memory: 320Mi }
      limits: { memory: 512Mi }
    env:
      CORS_ALLOWED_ORIGINS: ""

  employee-service:
    enabled: true
    port: 8085
    dbName: banksphere_employee
    replicas: 1
    ingressPaths:
      - /api/v1/employees
      - /api/v1/operations
      - /api/v1/employee
    secretEnv: [EMPLOYEE_JWT_SECRET]
    resources:
      requests: { cpu: 150m, memory: 384Mi }
      limits: { memory: 640Mi }
    env:
      EMPLOYEE_JWT_EXPIRATION: "1800"
      ACCOUNT_SERVICE_URL: http://account-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      BENEFICIARY_SERVICE_URL: http://beneficiary-service:8084
      KYC_SERVICE_URL: http://kyc-service:8086
      # ops-<env>.<domain> — set per environment, see this file's header.
      EMPLOYEE_PORTAL_CORS_ORIGIN: ""

  kyc-service:
    enabled: true
    port: 8086
    dbName: banksphere_kyc
    replicas: 1
    ingressPaths:
      - /api/v1/kyc
    secretEnv: [JWT_SECRET, EMPLOYEE_JWT_SECRET]
    resources:
      requests: { cpu: 150m, memory: 384Mi }
      limits: { memory: 640Mi }
    env:
      KYC_DOCUMENT_STORAGE_PATH: /data/kyc-documents
      # app-<env>.<domain>,ops-<env>.<domain> — set per environment (this
      # is the one service with a two-origin CORS list — see
      # application.yml's own comment on the customer+employee dual
      # consumer pattern, carried over from docker-compose).
      KYC_CORS_ALLOWED_ORIGINS: ""
    persistence:
      enabled: true
      storage: 2Gi
      storageClassName: local-path
      mountPath: /data/kyc-documents

# customerPortal is now the REAL frontend hosting path (as of the
# public-ALB/API-Gateway architecture change) — reached via the public
# ALB -> Traefik -> this Service, see templates/ingress.yaml's frontend
# rule. No longer S3 + CloudFront (removed — see
# docs/deployment/frontend-hosting.md's superseding note).
#
# employeePortal is now also real: same public ALB as customerPortal,
# reached on its own hostname (ingress.opsHost) via templates/
# ingress.yaml's second, host-scoped rule — not path-based like the
# backend services, since a portal owns its whole origin. See
# environments/dev/dns.tf's ops_fqdn wiring and acm.tf's
# additional_fqdns (the SAME public-ALB certificate covers both hosts).
portals:
  customerPortal:
    enabled: true
    repository: customer-portal # matches the ECR repo name — see modules/ecr's repository_names
    port: 80
    replicas: 1
    # Injected as the API_BASE_URL container env var, read by the
    # image's docker-entrypoint.d script at container start and
    # written into config.js for the app to read at runtime (see
    # frontend/src/config/runtimeConfig.ts) — this is what lets the
    # SAME built image serve DEV and TEST correctly despite Vite
    # baking config in at build time. Empty is a supported state
    # (matches ingress.host's own convention): falls back to
    # VITE_*_SERVICE_URL / localhost, same as local dev.
    apiBaseUrl: ""
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 128Mi }
  employeePortal:
    enabled: true
    repository: employee-portal
    port: 80
    replicas: 1
    apiBaseUrl: ""
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 128Mi }
