{{- $root := . }}
{{- range $key, $portal := .Values.portals }}
{{- if $portal.enabled }}
# customerPortal is the real frontend hosting path (see values.yaml's
# own comment); employeePortal stays disabled pending a decision on
# where it should be served. The API_BASE_URL env var below is read by
# the image's docker-entrypoint.d script at container start and written
# into config.js for the app to read at runtime (see
# frontend/src/config/runtimeConfig.ts) — Vite's build-time VITE_*_URL
# values are baked in too, but only as the local-dev fallback; runtime
# config takes priority whenever this is non-empty. This is what lets
# ONE built image (per values.image.tag, promoted unchanged like the six
# backend images) correctly serve different environments despite Vite
# baking config in at build time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $portal.repository }}
  labels:
    {{- include "banksphere.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $portal.repository }}
spec:
  replicas: {{ $portal.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $portal.repository }}
  template:
    metadata:
      labels:
        {{- include "banksphere.labels" $root | nindent 8 }}
        app.kubernetes.io/name: {{ $portal.repository }}
    spec:
      imagePullSecrets:
        - name: {{ $root.Values.imagePullSecrets.name }}
      containers:
        - name: {{ $portal.repository }}
          image: {{ include "banksphere.image" (dict "registry" $root.Values.image.registry "repositoryPrefix" $root.Values.image.repositoryPrefix "repository" $portal.repository "tag" $root.Values.image.tag) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          env:
            - name: API_BASE_URL
              value: {{ $portal.apiBaseUrl | default "" | quote }}
          ports:
            - containerPort: {{ $portal.port }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ $portal.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ $portal.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $portal.resources | nindent 12 }}
---
{{- end }}
{{- end }}
