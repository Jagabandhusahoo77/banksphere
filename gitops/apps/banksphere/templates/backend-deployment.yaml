{{- $root := . }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "banksphere.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "banksphere.labels" $root | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      imagePullSecrets:
        - name: {{ $root.Values.imagePullSecrets.name }}
      containers:
        - name: {{ $name }}
          image: {{ include "banksphere.image" (dict "registry" $root.Values.image.registry "repositoryPrefix" $root.Values.image.repositoryPrefix "repository" $name "tag" $root.Values.image.tag) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: {{ $root.Values.postgres.port | quote }}
            - name: DB_NAME
              value: {{ $svc.dbName }}
            - name: DB_USERNAME
              value: {{ $root.Values.postgres.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.appSecretName }}
                  key: DB_PASSWORD
            {{- range $svc.secretEnv }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.appSecretName }}
                  key: {{ . }}
            {{- end }}
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ $svc.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ $svc.port }}
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- if and $svc.persistence $svc.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ $svc.persistence.mountPath }}
          {{- end }}
      {{- if and $svc.persistence $svc.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
      {{- end }}
---
{{- end }}
{{- end }}
