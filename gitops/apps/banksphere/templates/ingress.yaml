{{- if .Values.ingress.enabled }}
# A single Ingress, reached via TWO different AWS front doors now (see
# the architecture-change report):
#   - the PUBLIC ALB (api_ports.ingress_http) forwards frontend traffic
#     here — the "/" catch-all rule below routes it to customer-portal.
#   - the PRIVATE ALB, reached only via API Gateway's VPC Link, ALSO
#     forwards here, on the same port — the backend path-prefix rules
#     below (unchanged from before this architecture change) route it to
#     the six backend services. Traefik/this Ingress is what actually
#     separates the two, by path, not two different Ingress objects or
#     two different Traefik configs.
#
# /actuator/health is routed to customer-service specifically so
# modules/alb's target group health check (see that module's own
# comment, on BOTH the public and private ALB instantiations) has
# something real, public, and always-up to hit — see
# docs/deployment/ingress.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banksphere-api
  labels:
    {{- include "banksphere.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /actuator/health
            pathType: Exact
            backend:
              service:
                name: customer-service
                port:
                  number: {{ (index .Values.services "customer-service").port }}
          {{- range $name, $svc := .Values.services }}
          {{- if $svc.enabled }}
          {{- range $svc.ingressPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if .Values.portals.customerPortal.enabled }}
          # Catch-all, deliberately LAST and LEAST specific — Kubernetes
          # Ingress path matching is longest-prefix-first, so every
          # backend path above (e.g. /api/v1/accounts) always wins over
          # this "/" rule regardless of declaration order. Only requests
          # that don't match any backend prefix (i.e. the frontend's own
          # static assets/routes) fall through to here.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.portals.customerPortal.repository }}
                port:
                  number: {{ .Values.portals.customerPortal.port }}
          {{- end }}
    {{- if and .Values.portals.employeePortal.enabled .Values.ingress.opsHost }}
    # A second, separate rule — its own `host:` is what differentiates
    # it from the rule above, which has no host restriction and would
    # otherwise catch every request (Traefik/Kubernetes Ingress treats a
    # host-less rule as the wildcard fallback). Requests carrying
    # ops-<env>.<domain> as their Host header match THIS rule instead
    # and go straight to employee-portal; every other host (app-<env>,
    # api-<env>, or the raw ALB DNS name) is unaffected and keeps
    # matching the rule above exactly as before.
    - host: {{ .Values.ingress.opsHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.portals.employeePortal.repository }}
                port:
                  number: {{ .Values.portals.employeePortal.port }}
    {{- end }}
{{- end }}
