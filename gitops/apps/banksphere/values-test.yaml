# TEST overrides layered on top of values.yaml — mirrors values-dev.yaml
# exactly, with "-test" hostnames. See values-dev.yaml's header comment
# for what every remaining TODO below actually means and why it's
# genuinely unknown at this point (no AWS resources created for TEST
# yet — see environments/test).
#
# image.registry is set (not a TODO) even though TEST itself hasn't been
# applied yet: ECR is a single shared registry across DEV/TEST in this
# same AWS account/region (see environments/test/ecr.tf's data-source
# lookup against DEV's repos), so the hostname is identical and known
# now — see values-dev.yaml's own comment for why leaving this empty
# breaks every pod's image pull once TEST does get stood up.

image:
  registry: "997979358886.dkr.ecr.us-east-1.amazonaws.com"

ingress:
  host: "" # TODO: api-test.<domain>, once a domain is configured

portals:
  customerPortal:
    apiBaseUrl: "" # TODO: https://api-test.<domain> once a domain is configured, or the API Gateway endpoint in the meantime (`terraform output api_gateway_endpoint` in environments/test) — set by the CI pipeline's UpdateGitOpsTest stage, not meant to stay a manual TODO

services:
  customer-service:
    env:
      CORS_ALLOWED_ORIGINS: "" # TODO: https://app-test.<domain>
      COOKIE_SECURE: "false" # TODO: "true" once served over HTTPS
  account-service:
    env:
      CORS_ALLOWED_ORIGINS: "" # TODO: https://app-test.<domain>
  transaction-service:
    env:
      CORS_ALLOWED_ORIGINS: "" # TODO: https://app-test.<domain>
  beneficiary-service:
    env:
      CORS_ALLOWED_ORIGINS: "" # TODO: https://app-test.<domain>
  employee-service:
    env:
      EMPLOYEE_PORTAL_CORS_ORIGIN: "" # TODO: https://ops-test.<domain>
  kyc-service:
    env:
      KYC_CORS_ALLOWED_ORIGINS: "" # TODO: https://app-test.<domain>,https://ops-test.<domain>
