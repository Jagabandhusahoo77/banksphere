# DEV overrides layered on top of values.yaml. Only what genuinely
# differs for this environment — see values.yaml's header comment.
#
# Everything marked TODO below is a real, currently-unknown value (no
# AWS resources have been created this phase — see the Phase 10A
# report's "AWS credentials" note) and MUST be filled in as part of
# actually standing up DEV, not left as-is:
#   - image.registry: the ECR registry hostname, a Terraform OUTPUT
#     (`terraform output` in environments/dev, after `apply`) —
#     <account-id>.dkr.ecr.<region>.amazonaws.com.
#   - ingress.host / the CORS/origin values: only meaningful once a real
#     domain is configured (environments/dev's own domain_name variable)
#     — see docs/deployment/dns-and-https.md. Left empty here is a fully
#     supported state (matches modules/dns's domain_configured gate):
#     the environment is still reachable over the ALB's own AWS-assigned
#     DNS name / the CloudFront distributions' own *.cloudfront.net
#     names, just without pretty hostnames or a valid CORS allow-list
#     for a browser-based flow yet.

image:
  registry: "" # TODO: fill in after `terraform apply` in environments/dev — see header comment

ingress:
  host: "" # TODO: api-dev.<domain>, once a domain is configured

portals:
  customerPortal:
    apiBaseUrl: "" # TODO: https://api-dev.<domain> once a domain is configured, or the API Gateway endpoint in the meantime (`terraform output api_gateway_endpoint` in environments/dev) — set by the CI pipeline's UpdateGitOpsDev stage, not meant to stay a manual TODO

services:
  customer-service:
    env:
      CORS_ALLOWED_ORIGINS: "" # TODO: https://app-dev.<domain>
      COOKIE_SECURE: "false" # TODO: "true" once served over HTTPS (api-dev.<domain> with a validated ACM cert)
  account-service:
    env:
      CORS_ALLOWED_ORIGINS: "" # TODO: https://app-dev.<domain>
  transaction-service:
    env:
      CORS_ALLOWED_ORIGINS: "" # TODO: https://app-dev.<domain>
  beneficiary-service:
    env:
      CORS_ALLOWED_ORIGINS: "" # TODO: https://app-dev.<domain>
  employee-service:
    env:
      EMPLOYEE_PORTAL_CORS_ORIGIN: "" # TODO: https://ops-dev.<domain>
  kyc-service:
    env:
      KYC_CORS_ALLOWED_ORIGINS: "" # TODO: https://app-dev.<domain>,https://ops-dev.<domain>
