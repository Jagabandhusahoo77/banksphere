# DEV overrides layered on top of values.yaml. Only what genuinely
# differs for this environment — see values.yaml's header comment.
#
# image.registry / image.tag: see the header comment history in git log
# for why registry is a fixed, environment-static value (not a TODO)
# while tag is rewritten on every deploy by the CI pipeline's
# UpdateGitOpsDev stage.
#
# A real domain (bankspere.in.net) is configured as of this pass — see
# environments/dev/terraform.tfvars and dns.tf/acm.tf — so every
# hostname/CORS-origin value below is now a real, filled-in value
# instead of the earlier "no domain yet" empty-string TODOs.

image:
  registry: "997979358886.dkr.ecr.us-east-1.amazonaws.com"
  tag: 0d4a0c4a6ea6e1c41de2dfd158631b181bdab841
ingress:
  # Deliberately still empty, NOT api-dev.bankspere.in.net — this rule
  # is shared by BOTH the backend paths (reached via api-dev, through
  # API Gateway/the private ALB) AND customerPortal's "/" catch-all
  # (reached via app-dev, through the public ALB directly). Path-based
  # matching already separates the two correctly regardless of which
  # hostname a request arrived on; giving this rule a specific host
  # would make it match ONLY that one hostname and silently 404 every
  # app-dev request (no other rule handles app-dev). opsHost below is
  # safe to set because employee-portal genuinely owns its own
  # dedicated rule/hostname, unlike this one.
  host: ""
  opsHost: "ops-dev.bankspere.in.net"
portals:
  customerPortal:
    apiBaseUrl: "https://3oya8p6fka.execute-api.us-east-1.amazonaws.com"
  employeePortal:
    apiBaseUrl: "https://api-dev.bankspere.in.net"
services:
  customer-service:
    env:
      CORS_ALLOWED_ORIGINS: "https://app-dev.bankspere.in.net"
      COOKIE_SECURE: "true"
  account-service:
    env:
      CORS_ALLOWED_ORIGINS: "https://app-dev.bankspere.in.net"
  transaction-service:
    env:
      CORS_ALLOWED_ORIGINS: "https://app-dev.bankspere.in.net"
  beneficiary-service:
    env:
      CORS_ALLOWED_ORIGINS: "https://app-dev.bankspere.in.net"
  employee-service:
    env:
      EMPLOYEE_PORTAL_CORS_ORIGIN: "https://ops-dev.bankspere.in.net"
  kyc-service:
    env:
      KYC_CORS_ALLOWED_ORIGINS: "https://app-dev.bankspere.in.net,https://ops-dev.bankspere.in.net"
