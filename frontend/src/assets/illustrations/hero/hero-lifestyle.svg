<svg width="560" height="480" viewBox="0 0 560 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of two people reviewing their savings growth together on a laptop">
  <rect x="0" y="0" width="560" height="480" rx="28" fill="#E7F1FA" />
  <circle cx="452" cy="88" r="46" fill="#C9962B" opacity="0.16" />
  <circle cx="70" cy="400" r="60" fill="#0B5FA3" opacity="0.08" />

  <!-- table -->
  <rect x="90" y="330" width="380" height="18" rx="9" fill="#FFFFFF" />
  <rect x="120" y="348" width="14" height="70" fill="#FFFFFF" />
  <rect x="426" y="348" width="14" height="70" fill="#FFFFFF" />

  <!-- laptop -->
  <rect x="230" y="268" width="120" height="80" rx="10" fill="#073A66" />
  <rect x="240" y="278" width="100" height="58" rx="4" fill="#FFFFFF" />
  <path d="M254 320l16-12 14 8 20-18 26 14" stroke="#0E9384" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="216" y="346" width="148" height="10" rx="5" fill="#0B5FA3" />

  <!-- figure 1 (seated, left) -->
  <path d="M150 330c0-30 18-52 44-52s44 22 44 52" fill="#0B5FA3" />
  <circle cx="194" cy="248" r="28" fill="#0B5FA3" />
  <circle cx="184" cy="244" r="3" fill="#FFFFFF" />
  <circle cx="204" cy="244" r="3" fill="#FFFFFF" />
  <path d="M186 258q8 6 16 0" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- figure 2 (seated, right) -->
  <path d="M366 330c0-30 18-52 44-52s44 22 44 52" fill="#0E9384" />
  <circle cx="410" cy="248" r="28" fill="#0E9384" />
  <circle cx="400" cy="244" r="3" fill="#FFFFFF" />
  <circle cx="420" cy="244" r="3" fill="#FFFFFF" />
  <path d="M402 258q8 6 16 0" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- floating balance card -->
  <rect x="356" y="120" width="140" height="86" rx="14" fill="#FFFFFF" stroke="#0B5FA3" stroke-width="2" />
  <rect x="374" y="140" width="70" height="10" rx="5" fill="#94A3B8" />
  <rect x="374" y="160" width="100" height="16" rx="8" fill="#0F172A" opacity="0.85" />
  <path d="M374 188l18-10 14 6 22-16" stroke="#C9962B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

