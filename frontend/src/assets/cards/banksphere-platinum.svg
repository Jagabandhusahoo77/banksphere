<svg width="400" height="252" viewBox="0 0 400 252" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BankSphere Platinum Card, an original fictional card design">
  <defs>
    <linearGradient id="platinum-bg" x1="0" y1="0" x2="400" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="400" height="252" rx="18" fill="url(#platinum-bg)" />
  <ellipse cx="360" cy="20" rx="140" ry="90" fill="#F8FAFC" opacity="0.04" />

  <!-- brand mark -->
  <g transform="translate(24 24)">
    <rect width="28" height="28" rx="8" fill="#0B5FA3" />
    <circle cx="14" cy="14" r="6.5" fill="none" stroke="#F8FAFC" stroke-width="1.6" />
    <ellipse cx="14" cy="14" rx="10.5" ry="4" fill="none" stroke="#F8FAFC" stroke-width="1.2" opacity="0.9" transform="rotate(-20 14 14)" />
  </g>
  <text x="60" y="42" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">BankSphere</text>

  <!-- chip -->
  <rect x="24" y="96" width="42" height="32" rx="6" fill="#C9962B" />
  <rect x="30" y="103" width="30" height="18" rx="2" fill="none" stroke="#0F172A" stroke-width="1.2" opacity="0.5" />

  <!-- contactless -->
  <g transform="translate(84 100)" stroke="#F8FAFC" stroke-width="2" fill="none" opacity="0.85">
    <path d="M0 12a12 12 0 0 1 12-12" />
    <path d="M4 12a8 8 0 0 1 8-8" transform="translate(0 0)" />
    <path d="M8 12a4 4 0 0 1 4-4" />
  </g>

  <!-- number -->
  <text x="24" y="168" font-family="ui-monospace, monospace" font-size="20" letter-spacing="3" fill="#F8FAFC" opacity="0.92">•••• •••• •••• 4821</text>

  <!-- cardholder + expiry -->
  <text x="24" y="204" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#CBD5E1">CARDHOLDER NAME</text>
  <text x="310" y="204" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11" letter-spacing="1" fill="#CBD5E1">MM/YY</text>

  <!-- footer -->
  <text x="24" y="230" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#F8FAFC">PLATINUM</text>
  <text x="330" y="230" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">VISA</text>
</svg>
