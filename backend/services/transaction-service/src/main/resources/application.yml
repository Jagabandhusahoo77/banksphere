server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:banksphere_transaction}
    username: ${DB_USERNAME:banksphere}
    password: ${DB_PASSWORD:banksphere_local_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

banksphere:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Must match customer-service's JWT_SECRET exactly — see docs/security/jwt.md.
    secret: ${JWT_SECRET:banksphere-local-development-only-jwt-signing-secret-change-me-1234567890}
  employee-jwt:
    # Must match employee-service's EMPLOYEE_JWT_SECRET — see ADR-007.
    secret: ${EMPLOYEE_JWT_SECRET:banksphere-local-development-only-EMPLOYEE-jwt-signing-secret-change-me-987654321}
  account-service:
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.banksphere.transaction: INFO
