server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: customer-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:banksphere_customer}
    username: ${DB_USERNAME:banksphere}
    password: ${DB_PASSWORD:banksphere_local_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

banksphere:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Local-dev-only default, same pattern as DB_PASSWORD — never a real
    # secret. See docs/security/jwt.md. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:banksphere-local-development-only-jwt-signing-secret-change-me-1234567890}
    expiration-seconds: ${JWT_EXPIRATION:3600}
  employee-jwt:
    # Must match employee-service's EMPLOYEE_JWT_SECRET — see ADR-007.
    secret: ${EMPLOYEE_JWT_SECRET:banksphere-local-development-only-EMPLOYEE-jwt-signing-secret-change-me-987654321}
  # Phase 9D — see ADR-009.
  otp:
    length: ${OTP_LENGTH:6}
    expiry-seconds: ${OTP_EXPIRY_SECONDS:300}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}
    # How long a VERIFIED step-up challenge remains executable — the
    # window to actually call the protected operation (e.g. transfer)
    # after entering the code, separate from (and longer than) the OTP's
    # own entry expiry above.
    step-up-expiry-seconds: ${OTP_STEP_UP_EXPIRY_SECONDS:300}
    dev-inbox:
      # MUST be false (or simply not deployed) in any real environment —
      # see DevOtpInboxController's own javadoc. true is the local
      # Docker Compose development default, same convention as every
      # other local-dev-only default in this codebase.
      enabled: ${OTP_DEV_INBOX_ENABLED:true}
  refresh-token:
    expiry-seconds: ${REFRESH_TOKEN_EXPIRY_SECONDS:1209600} # 14 days
    # MUST be true in any real HTTPS deployment — false is the local
    # plain-HTTP Docker Compose development default (a browser silently
    # refuses to ever send a Secure cookie over HTTP). See
    # RefreshTokenCookies's own javadoc and ADR-009.
    cookie-secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.banksphere.customer: INFO
