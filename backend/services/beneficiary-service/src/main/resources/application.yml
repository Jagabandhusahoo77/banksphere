server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: beneficiary-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:banksphere_beneficiary}
    username: ${DB_USERNAME:banksphere}
    password: ${DB_PASSWORD:banksphere_local_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

banksphere:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Must match customer-service's JWT_SECRET exactly — see docs/security/jwt.md.
    secret: ${JWT_SECRET:banksphere-local-development-only-jwt-signing-secret-change-me-1234567890}
  # Phase 9C — accepts employee-signed tokens for the first time, on the
  # new Customer 360 employee endpoint only. See ADR-006/ADR-007/ADR-008.
  employee-jwt:
    secret: ${EMPLOYEE_JWT_SECRET:banksphere-local-development-only-EMPLOYEE-jwt-signing-secret-change-me-987654321}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.banksphere.beneficiary: INFO
