# AWS TEST Docker Compose — runs on the single TEST EC2 instance.
#
# Byte-for-byte identical in shape to infrastructure/docker/dev/docker-compose.yml
# on purpose — every value that actually differs between DEV and TEST
# (database credentials, JWT secrets, domain, image tag currently
# deployed) comes from this instance's OWN .env file, populated from
# THIS environment's own SSM Parameter Store path
# (/banksphere/test/*, never /banksphere/dev/*) by
# infrastructure/scripts/test/deploy.sh — see docs/deployment/environments.md
# for why DEV and TEST are two separate compose invocations against two
# separate EC2 instances rather than one shared multi-tenant stack.
#
# Deliberately NOT the same file as docker/local/docker-compose.yml:
#  - images are PULLED from ECR (built once by the CI pipeline), never
#    built from source on the instance — see infrastructure/README.md.
#  - no backend service or Postgres publishes a host port; only the two
#    frontend containers and the gateway do, and even those are reachable
#    only from the ALB's security group, never directly from the internet
#    — see infrastructure/terraform/modules/security.
#  - every JVM service gets an explicit heap cap (JAVA_OPTS) and a
#    container memory limit (mem_limit) sized for a cost-conscious
#    t3.medium instance — see docs/deployment/cost-drivers.md.
#  - container logs ship to CloudWatch Logs via Docker's awslogs driver,
#    using the instance's own IAM role — no credentials configured here.
#
# All ${VAR} references below are resolved by `docker compose` itself from
# the .env file deploy.sh writes alongside this file (see
# infrastructure/scripts/dev/deploy.sh) — NOT by Terraform, which only
# embeds this file's contents verbatim into the instance's bootstrap (see
# infrastructure/terraform/modules/ec2/main.tf's comment on why it reads
# this file with `file()`, not `templatefile()`).

networks:
  banksphere-network:
    driver: bridge

volumes:
  banksphere-postgres-data:
  banksphere-kyc-documents:

x-logging: &default-logging
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION}
    awslogs-group: ${LOG_GROUP_NAME}
    awslogs-create-group: "true"

services:

  postgres:
    image: postgres:16-alpine
    container_name: banksphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: banksphere_customer
    volumes:
      - banksphere-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *default-logging
    networks:
      - banksphere-network
    # No published host port, deliberately — see this file's header
    # comment. Reach it for backup/admin purposes via
    # `docker exec -it banksphere-postgres psql ...` over an SSM session,
    # never over the network. See infrastructure/scripts/dev/backup-postgres.sh.

  customer-service:
    image: ${ECR_REGISTRY}/customer-service:${IMAGE_TAG}
    container_name: banksphere-customer-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: banksphere_customer
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: https://app-${ENVIRONMENT}.${DOMAIN_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 3600
      EMPLOYEE_JWT_SECRET: ${EMPLOYEE_JWT_SECRET}
      OTP_DEV_INBOX_ENABLED: "false" # MUST be false outside local dev — see ADR-009
      COOKIE_SECURE: "true"          # HTTPS-only in every cloud environment — see ADR-009
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    mem_limit: 384m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banksphere-network

  account-service:
    image: ${ECR_REGISTRY}/account-service:${IMAGE_TAG}
    container_name: banksphere-account-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: banksphere_account
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      CORS_ALLOWED_ORIGINS: https://app-${ENVIRONMENT}.${DOMAIN_NAME}
      JWT_SECRET: ${JWT_SECRET}
      EMPLOYEE_JWT_SECRET: ${EMPLOYEE_JWT_SECRET}
      STEP_UP_TRANSFER_THRESHOLD: "50000.00"
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    mem_limit: 384m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banksphere-network

  transaction-service:
    image: ${ECR_REGISTRY}/transaction-service:${IMAGE_TAG}
    container_name: banksphere-transaction-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: banksphere_transaction
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: https://app-${ENVIRONMENT}.${DOMAIN_NAME}
      JWT_SECRET: ${JWT_SECRET}
      EMPLOYEE_JWT_SECRET: ${EMPLOYEE_JWT_SECRET}
      ACCOUNT_SERVICE_URL: http://account-service:8082
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    mem_limit: 384m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banksphere-network

  beneficiary-service:
    image: ${ECR_REGISTRY}/beneficiary-service:${IMAGE_TAG}
    container_name: banksphere-beneficiary-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: banksphere_beneficiary
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: https://app-${ENVIRONMENT}.${DOMAIN_NAME}
      JWT_SECRET: ${JWT_SECRET}
      EMPLOYEE_JWT_SECRET: ${EMPLOYEE_JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    mem_limit: 384m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banksphere-network

  employee-service:
    image: ${ECR_REGISTRY}/employee-service:${IMAGE_TAG}
    container_name: banksphere-employee-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: banksphere_employee
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EMPLOYEE_PORTAL_CORS_ORIGIN: https://ops-${ENVIRONMENT}.${DOMAIN_NAME}
      EMPLOYEE_JWT_SECRET: ${EMPLOYEE_JWT_SECRET}
      EMPLOYEE_JWT_EXPIRATION: 1800
      ACCOUNT_SERVICE_URL: http://account-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      BENEFICIARY_SERVICE_URL: http://beneficiary-service:8084
      KYC_SERVICE_URL: http://kyc-service:8086
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    mem_limit: 384m
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banksphere-network

  kyc-service:
    image: ${ECR_REGISTRY}/kyc-service:${IMAGE_TAG}
    container_name: banksphere-kyc-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: banksphere_kyc
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KYC_CORS_ALLOWED_ORIGINS: https://app-${ENVIRONMENT}.${DOMAIN_NAME},https://ops-${ENVIRONMENT}.${DOMAIN_NAME}
      JWT_SECRET: ${JWT_SECRET}
      EMPLOYEE_JWT_SECRET: ${EMPLOYEE_JWT_SECRET}
      KYC_DOCUMENT_STORAGE_PATH: /data/kyc-documents
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    mem_limit: 384m
    volumes:
      - banksphere-kyc-documents:/data/kyc-documents
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banksphere-network

  customer-portal:
    image: ${ECR_REGISTRY}/customer-portal:${IMAGE_TAG}
    container_name: banksphere-customer-portal
    restart: unless-stopped
    ports:
      - "8080:80"
    mem_limit: 64m
    logging: *default-logging
    networks:
      - banksphere-network

  employee-portal:
    image: ${ECR_REGISTRY}/employee-portal:${IMAGE_TAG}
    container_name: banksphere-employee-portal
    restart: unless-stopped
    ports:
      - "8090:80"
    mem_limit: 64m
    logging: *default-logging
    networks:
      - banksphere-network

  # Single internal reverse proxy fanning out api-${ENVIRONMENT}.${DOMAIN_NAME}
  # to all six backend services by their existing path prefixes — see
  # gateway.nginx.conf. Not built from source; a stock nginx image with
  # two config files bind-mounted in.
  gateway:
    image: nginx:1.27-alpine
    container_name: banksphere-gateway
    restart: unless-stopped
    volumes:
      - ./gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway-proxy-params.conf:/etc/nginx/gateway-proxy-params.conf:ro
    ports:
      - "8000:80"
    mem_limit: 64m
    logging: *default-logging
    depends_on:
      - customer-service
      - account-service
      - transaction-service
      - beneficiary-service
      - employee-service
      - kyc-service
    networks:
      - banksphere-network
