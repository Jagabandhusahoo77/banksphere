# Shared proxy settings for every backend location block in gateway.nginx.conf.
# Forwards the real client IP and original scheme/host so each Spring
# service's own CORS/security logic (and ClientIpResolver — see
# customer-service's OTP rate limiting, Phase 9D) sees the actual
# end-user request, not "the gateway container called me."
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
