# Single internal entry point for api-dev.<domain>, fanning out to the six
# backend services by their EXISTING @RequestMapping path prefixes — no
# backend route was changed or renamed to make this possible (see
# docs/deployment/networking.md). This container is reachable only from
# the ALB's "api" target group (see infrastructure/terraform/environments/dev),
# never published on a host port that's directly internet-facing.
#
# Health check endpoint (/healthz) is answered directly by this nginx, not
# proxied — it exists purely for the ALB target group health check and
# must stay a static 200, independent of any backend service's own health.

server {
    listen 80;
    server_name _;

    location = /healthz {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # customer-service — auth (including Phase 9D OTP/step-up/refresh) + customer profile
    location /api/v1/auth/ {
        proxy_pass http://customer-service:8081;
        include /etc/nginx/gateway-proxy-params.conf;
    }

    location /api/v1/customers/ {
        proxy_pass http://customer-service:8081;
        include /etc/nginx/gateway-proxy-params.conf;
    }

    # account-service
    location /api/v1/accounts/ {
        proxy_pass http://account-service:8082;
        include /etc/nginx/gateway-proxy-params.conf;
    }

    # transaction-service
    location /api/v1/transactions/ {
        proxy_pass http://transaction-service:8083;
        include /etc/nginx/gateway-proxy-params.conf;
    }

    # beneficiary-service
    location /api/v1/beneficiaries/ {
        proxy_pass http://beneficiary-service:8084;
        include /etc/nginx/gateway-proxy-params.conf;
    }

    # employee-service — employee CRUD, Employee Operations API, and the
    # (singular-path) Customer 360 aggregation endpoint all live here
    location /api/v1/employees/ {
        proxy_pass http://employee-service:8085;
        include /etc/nginx/gateway-proxy-params.conf;
    }

    location /api/v1/operations/ {
        proxy_pass http://employee-service:8085;
        include /etc/nginx/gateway-proxy-params.conf;
    }

    location /api/v1/employee/ {
        proxy_pass http://employee-service:8085;
        include /etc/nginx/gateway-proxy-params.conf;
    }

    # kyc-service
    location /api/v1/kyc/ {
        proxy_pass http://kyc-service:8086;
        include /etc/nginx/gateway-proxy-params.conf;
    }

    location / {
        return 404;
    }
}
